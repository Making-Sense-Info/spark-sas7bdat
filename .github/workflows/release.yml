# Publish thin + fat (classifier assembly) JARs to Maven Central on tags vX.Y.Z.
# Version source of truth: SparkVersions.Spark4LibraryVersion (sbt, not a pom).
# Tag must match that version, e.g. v4.0.1.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Spark 4 thin + fat JARs
    runs-on: ubuntu-latest
    if: github.repository == 'Making-Sense-Info/spark-sas7bdat'
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Import GPG key
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PGP_SECRET:-}" ]; then
            echo "Secret PGP_SECRET is empty"
            exit 1
          fi
          # Prefer base64-encoded secret (survives GitHub secret newline stripping).
          # Fallback: armored ASCII if it already starts with BEGIN.
          KEYFILE=$(mktemp)
          if printf '%s' "$PGP_SECRET" | grep -q 'BEGIN PGP'; then
            printf '%s\n' "$PGP_SECRET" > "$KEYFILE"
          else
            printf '%s' "$PGP_SECRET" | base64 --decode > "$KEYFILE"
          fi
          if ! grep -q 'BEGIN PGP' "$KEYFILE"; then
            echo "PGP_SECRET is not a valid armored key (and base64 decode failed)."
            echo "Set PGP_SECRET to: gpg --armor --export-secret-keys KEYID | base64"
            exit 1
          fi
          gpg --batch --import "$KEYFILE"
          rm -f "$KEYFILE"
          gpg --list-secret-keys --keyid-format LONG
          # sbt-pgp looks up a signing key; pin the first secret key if needed
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2; exit}' | cut -d/ -f2)
          echo "Using signing key: ${KEY_ID}"
          echo "PGP_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"

      - name: Check tag matches sbt version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vX.Y.Z without SNAPSHOT (got ${GITHUB_REF_NAME})"
            exit 1
          fi
          # Read version from source of truth (avoid sbt stdout noise on CI).
          LIB_VERSION=$(sed -n 's/.*val Spark4LibraryVersion *= *"\([^"]*\)".*/\1/p' project/SparkVersions.scala | head -n1)
          echo "tag=${TAG_VERSION} sbt=${LIB_VERSION}"
          if [[ "$LIB_VERSION" == *SNAPSHOT* ]]; then
            echo "Spark4LibraryVersion is still ${LIB_VERSION}."
            echo "Set it to ${TAG_VERSION} (drop -SNAPSHOT), commit, then tag v${TAG_VERSION}."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LIB_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match Spark4LibraryVersion (${LIB_VERSION})."
            echo "Set Spark4LibraryVersion to ${TAG_VERSION}, commit, then tag v${TAG_VERSION}."
            exit 1
          fi
          echo "LIB_VERSION=${LIB_VERSION}" >> "$GITHUB_ENV"

      - name: Test
        run: |
          export SBT_OPTS="$(tr '\n' ' ' < travis/jvmopts.test)"
          sbt -batch -Dspark.version=4.1.2 ++2.13.17 test

      - name: Build fat JAR (PySpark)
        run: |
          export SBT_OPTS="$(tr '\n' ' ' < travis/jvmopts.compile)"
          sbt -batch -Dspark.version=4.1.2 ++2.13.17 assembly

      - name: Verify fat JAR bundles Parso
        run: |
          set -euo pipefail
          JAR="target/scala-2.13/spark-sas7bdat-${LIB_VERSION}-s_2.13-assembly.jar"
          if [ ! -f "$JAR" ]; then
            echo "Fat JAR not found: $JAR"
            find target -name '*assembly*.jar' -type f 2>/dev/null || true
            exit 1
          fi
          jar tf "$JAR" | grep -q 'com/epam/parso/impl/SasFileReaderImpl.class'
          echo "Parso present in $JAR"

      - name: Publish to Maven Central
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SONATYPE_USERNAME:-}" ] || [ -z "${SONATYPE_PASSWORD:-}" ]; then
            echo "SONATYPE_USERNAME / SONATYPE_PASSWORD secrets are empty."
            echo "Create a User Token at https://central.sonatype.com/account and set both secrets."
            exit 1
          fi
          export SBT_OPTS="$(tr '\n' ' ' < travis/jvmopts.compile)"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          # Same sbt session: keep Spark 4 version + staging bundle consistent
          sbt -batch -Dspark.version=4.1.2 ++2.13.17 \
            "publishSigned; sonatypeBundleRelease"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/scala-2.13/spark-sas7bdat-${{ env.LIB_VERSION }}-s_2.13.jar
            target/scala-2.13/spark-sas7bdat-${{ env.LIB_VERSION }}-s_2.13-assembly.jar
