# CI matrix mirrors .travis.yml: legacy Spark 2.4 / 3.0 / 3.5 and Spark 4.1.2.
# No publish step — scalastyle, test, and package only.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "2.4.6"
            scala: "2.11.12"
            java: "8"
          - spark: "3.0.0"
            scala: "2.12.11"
            java: "8"
          - spark: "3.0.0"
            scala: "2.12.11"
            java: "11"
          - spark: "3.5.0"
            scala: "2.13.12"
            java: "8"
          - spark: "3.5.0"
            scala: "2.13.12"
            java: "11"
          - spark: "4.1.2"
            scala: "2.13.17"
            java: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-java${{ matrix.java }}-spark${{ matrix.spark }}-scala${{ matrix.scala }}-${{ hashFiles('**/*.sbt', 'project/*.scala', 'project/*.properties') }}
          restore-keys: |
            sbt-${{ runner.os }}-java${{ matrix.java }}-spark${{ matrix.spark }}-scala${{ matrix.scala }}-
            sbt-${{ runner.os }}-

      - name: Scalastyle
        run: >
          sbt -batch -no-colors -jvm-opts travis/jvmopts.test
          ++${{ matrix.scala }} -Dspark.version=${{ matrix.spark }}
          scalastyle

      - name: Test
        run: >
          sbt -batch -no-colors -jvm-opts travis/jvmopts.test
          ++${{ matrix.scala }} -Dspark.version=${{ matrix.spark }}
          test

      - name: Package
        run: >
          sbt -batch -no-colors -jvm-opts travis/jvmopts.compile
          ++${{ matrix.scala }} -Dspark.version=${{ matrix.spark }}
          package

      - name: Verify main JAR contains classes (Spark 4 line)
        if: matrix.spark == '4.1.2'
        run: |
          JAR="target/scala-${{ matrix.scala }}/spark-sas7bdat-4.0.0-s_${{ matrix.scala }}.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'com/github/saurfang/sas/spark/DefaultSource.class'
          SIZE=$(stat -c%s "$JAR")
          if [ "$SIZE" -gt 500000 ]; then
            echo "JAR looks too large ($SIZE bytes) — may be javadoc instead of classes"
            exit 1
          fi
