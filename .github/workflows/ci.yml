# CI matrix mirrors .travis.yml: legacy Spark 2.4 / 3.0 / 3.5 and Spark 4.1.2.
# No publish step — scalastyle, test, and package only.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Spark ${{ matrix.spark }} / Scala ${{ matrix.scala }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "2.4.6"
            scala: "2.11.12"
            java: "8"
          - spark: "3.0.0"
            scala: "2.12.11"
            java: "8"
          - spark: "3.0.0"
            scala: "2.12.11"
            java: "11"
          - spark: "3.5.0"
            scala: "2.13.12"
            java: "8"
          - spark: "3.5.0"
            scala: "2.13.12"
            java: "11"
          - spark: "4.1.2"
            scala: "2.13.17"
            java: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-java${{ matrix.java }}-spark${{ matrix.spark }}-scala${{ matrix.scala }}-${{ hashFiles('**/*.sbt', 'project/*.scala', 'project/*.properties') }}
          restore-keys: |
            sbt-${{ runner.os }}-java${{ matrix.java }}-spark${{ matrix.spark }}-scala${{ matrix.scala }}-
            sbt-${{ runner.os }}-

      - name: Scalastyle
        run: |
          export SBT_OPTS="$(tr '\n' ' ' < travis/jvmopts.test)"
          sbt -batch ++${{ matrix.scala }} -Dspark.version=${{ matrix.spark }} scalastyle

      - name: Test
        run: |
          export SBT_OPTS="$(tr '\n' ' ' < travis/jvmopts.test)"
          sbt -batch ++${{ matrix.scala }} -Dspark.version=${{ matrix.spark }} test

      - name: Package
        run: |
          export SBT_OPTS="$(tr '\n' ' ' < travis/jvmopts.compile)"
          sbt -batch ++${{ matrix.scala }} -Dspark.version=${{ matrix.spark }} package

      - name: Verify main JAR contains classes (Spark 4 line)
        if: matrix.spark == '4.1.2'
        run: |
          # sbt uses scala *binary* version in paths (2.13), not full version (2.13.17)
          JAR="target/scala-2.13/spark-sas7bdat-4.0.0-s_2.13.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected JAR not found: $JAR"
            find target -name 'spark-sas7bdat*.jar' -type f 2>/dev/null || true
            exit 1
          fi
          jar tf "$JAR" | grep -q 'com/github/saurfang/sas/spark/DefaultSource.class'
          SIZE=$(stat -c%s "$JAR")
          if [ "$SIZE" -gt 500000 ]; then
            echo "JAR looks too large ($SIZE bytes) — may be javadoc instead of classes"
            exit 1
          fi
